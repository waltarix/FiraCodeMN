rule dummy_assets_dir:
  pick: &assets_dir ./src/assets
rule dummy_glyphs_dir:
  pick: &glyphs_dir ./src/assets/glyphs

imports:
  # base fonts
  firacode-regular: *assets_dir
  firacode-bold: *assets_dir
  migu-1m: *assets_dir
  # glyphs
  FontAwesome: *glyphs_dir
  MaterialDesignIconsDesktop: *glyphs_dir
  Pomicons: *glyphs_dir
  PowerlineExtraSymbols: *glyphs_dir
  PowerlineSymbols: *glyphs_dir
  Unicode_IEC_symbol_font: *glyphs_dir
  codicon: *glyphs_dir
  devicons: *glyphs_dir
  extraglyphs: *glyphs_dir
  font-awesome-extension: *glyphs_dir
  font-logos: *glyphs_dir
  materialdesignicons-webfont: *glyphs_dir
  octicons: *glyphs_dir
  original-source: *glyphs_dir
  weathericons-regular-webfont: *glyphs_dir

curl module firacode-regular:
  url: https://github.com/waltarix/FiraCode/releases/download/6.2-custom-r5/FiraCode-Regular.otf
  sha1: fbb12571e6aa0badedfdd03af78c0c44b2d96877
curl module firacode-bold:
  url: https://github.com/waltarix/FiraCode/releases/download/6.2-custom-r5/FiraCode-Bold.otf
  sha1: 24f4f009f13fd479809369a1f689e4dcb4f2487b

curl module migu-1m:
  url: https://github.com/itouhiro/mixfont-mplus-ipa/releases/download/v2020.0307/migu-1m-20200307.zip
  unpack: zip
  export: migu-1m-20200307/
  pick: migu-1m-20200307/migu-1m-*.ttf
  sha1: 3964d783664dedf7ecd307a3a9e28a6e856637fc

